# Local development settings only. Cloud Auth changes require an explicit remote operation.
project_id = "yanke"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[local_smtp]
enabled = true
port = 54324

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[studio]
enabled = false

[edge_runtime]
enabled = false
