name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patch whitespace
        run: git show --format= --check HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:auth
      - run: npm run test:plans
      - run: npx expo install --check
      - name: Render the app with a web export
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/yanke-web-export" --max-workers 2
  db-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated database test engine
        run: npm install --prefix "$RUNNER_TEMP/yanke-db-validation" --no-save --no-package-lock @electric-sql/pglite@0.5.10
      - name: Verify migrations, constraints and user isolation
        run: node scripts/db/verify.mjs "$RUNNER_TEMP/yanke-db-validation/node_modules/@electric-sql/pglite/dist/index.js"
